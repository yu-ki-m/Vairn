<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Vairn</title>
    <meta name="description" content="Vairn diagram editor">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111315">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <script>
        // The vendored editor is an implementation detail and must never become Vairn's top-level page.
        if (window.top === window.self) {
            var appUrl = new URL('../', window.location.href);

            if (appUrl.pathname !== window.location.pathname) {
                window.location.replace(appUrl.href);
            }
        }
    </script>
    <link rel="stylesheet" type="text/css" href="styles/grapheditor.css">
    <link rel="stylesheet" media="(forced-colors: active)" href="styles/high-contrast.css" id="high-contrast-stylesheet">
    <script src="js/bootstrap.js"></script>
    <style type="text/css">
        #geInfo {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            display: grid;
            place-items: center;
            color: #eef1f4;
            background: #111315;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #geInfo .geBlock {
            min-width: 0;
            margin: 0;
            padding: 24px;
            text-align: center;
        }

        #geInfo .vairn-startup__logo {
            display: block;
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
        }

        #geInfo .vairn-startup__brand {
            display: block;
            margin: 0 0 14px;
            font-size: 20px;
            font-weight: 650;
        }

        #geInfo #geStatus {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin: 0;
            padding: 0;
            color: #9aa3ad;
            font-size: 13px;
            font-weight: 400;
        }

        #geInfo #geStatus::before {
            width: 12px;
            height: 12px;
            border: 2px solid #3d444c;
            border-top-color: #aab4bf;
            border-radius: 50%;
            content: "";
            animation: vairn-startup-spin 0.8s linear infinite;
        }

        @keyframes vairn-startup-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            #geInfo #geStatus::before { animation: none; }
        }
    </style>
</head>
<body class="geEditor geClassic">
<div id="geInfo">
    <div class="geBlock" role="status" aria-label="Vairn diagram editor is starting">
        <img class="vairn-startup__logo" src="../favicon.svg" alt="">
        <strong class="vairn-startup__brand">Vairn</strong>
        <h2 id="geStatus">Preparing diagram editor...</h2>
    </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
